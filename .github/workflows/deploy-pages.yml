name: Deploy All HTML to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger on any push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Configure Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3

      # Step 3: Upload all files in repo (preserves folders)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./   # deploy everything in repo root, including subfolders

      # Step 4: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
